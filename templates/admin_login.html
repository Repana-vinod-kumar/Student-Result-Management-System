<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Results Management System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#eef3f9;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    max-width:700px;
}

.result-card{
    background:#fff;
    width:100%;
    border-radius:18px;
    padding:35px;
    box-shadow:0 8px 20px rgba(0,0,0,.15);
}

.result-card h1{
    text-align:center;
    font-size:36px;
    font-weight:700;
    color:#112046;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    font-size:18px;
    color:#60708f;
    margin-bottom:30px;
}

.hall-input{
    height:55px;
    font-size:18px;
    border-radius:10px;
}

.check-btn{
    width:100%;
    height:55px;
    border:none;
    border-radius:10px;
    background:#101a36;
    color:white;
    font-size:20px;
    font-weight:bold;
    margin-top:20px;
    transition:.3s;
}

.check-btn:hover{
    background:#243b75;
}

@media(max-width:768px){

.container{
    max-width:95%;
}

.result-card{
    padding:25px;
}

.result-card h1{
    font-size:28px;
}

.subtitle{
    font-size:16px;
}

}

</style>

</head>

<body>

<div class="container">

    <div class="result-card">

        <h1>Student Results Management System</h1>

        <p class="subtitle">
            Enter your hall ticket number to view your marks memo.
        </p>

        <form method="POST" action="/">

            <input
                type="text"
                class="form-control hall-input"
                name="hallticket"
                placeholder="Enter your hall ticket number"
                required>

            <button class="check-btn" type="submit">
                Check Result
            </button>
            {% if message %}
<div class="alert alert-danger text-center mt-3">
    {{ message }}
</div>
{% endif %}
            

        </form>
        
    </div>

</div>

</body>

</html>
